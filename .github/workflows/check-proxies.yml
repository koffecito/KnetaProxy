name: Check proxies

on:
  schedule:
    - cron: "0 4,16 * * *"
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Версия Xray-core (например v26.10.21), пусто — версия по умолчанию"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: check-proxies
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.10.21' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: other/requirements.txt

      - name: Restore Xray-core cache
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: ~/xray-bin
          key: xray-${{ env.XRAY_VERSION }}-linux-64

      - name: Download Xray-core
        if: steps.xray-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          mkdir -p ~/xray-bin
          curl -fL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 -o /tmp/xray.zip "$base/Xray-linux-64.zip"
          if curl -fsL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 -o /tmp/xray.zip.dgst "$base/Xray-linux-64.zip.dgst"; then
            expected="$(grep -i -m1 -E '^SHA(2-)?256=' /tmp/xray.zip.dgst | sed 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            actual="$(sha256sum /tmp/xray.zip | cut -d' ' -f1)"
            if [ -n "$expected" ] && [ "$expected" != "$actual" ]; then
              echo "Xray checksum mismatch: expected $expected, got $actual" >&2
              exit 1
            fi
          fi
          unzip -o /tmp/xray.zip xray -d ~/xray-bin
          chmod +x ~/xray-bin/xray

      - name: Install Xray-core
        run: |
          sudo install -m 0755 ~/xray-bin/xray /usr/local/bin/xray
          xray version

      - name: Install Python deps
        run: pip install -r other/requirements.txt

      - name: Validate project
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
        run: python other/validate.py

      - name: Run checker
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          CHEBURCHECK_CACHE_HOURS: "72"
        run: python checker.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A sub/
          git diff --staged --quiet || git commit -m "chore: update proxy results [skip ci]"
          git push || { git pull --rebase && git push; }

      - name: Send Telegram stats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        run: python telegram/telegram_notify.py

