name: Check proxies

on:
  schedule:
    - cron: "0 4,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-proxies
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Xray-core
        run: |
          sudo bash -c "$(curl -fL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 https://github.com/XTLS/Xray-install/raw/main/install-release.sh)"
          xray version

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Validate project
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
        run: python validate.py

      - name: Run checker
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          MAX_WORKERS: "8"
          REQUEST_TIMEOUT: "8"
        run: python checker.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies/working.txt proxies/all.txt proxies/report.txt proxies/history.json
          git diff --staged --quiet || git commit -m "chore: update proxy results [skip ci]"
          git push || { git pull --rebase && git push; }

      - name: Send Telegram stats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        run: python telegram_notify.py

